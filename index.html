<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An interactive browser emulator for an 8-bit CPU and its assembly language.">
  <title>8-bit CPU Emulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./emulator.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto max-w-7xl px-5 py-8">
    <header class="mb-8">
      <p class="text-sm font-semibold uppercase tracking-[0.25em] text-cyan-400">CPU Simple Emulator</p>
      <h1 class="mt-2 text-3xl font-bold tracking-tight sm:text-4xl">8-bit CPU playground</h1>
      <p class="mt-2 text-slate-400">Assemble and execute programs directly in your browser.</p>
    </header>

    <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(20rem,0.8fr)]">
      <section class="rounded-2xl border border-slate-800 bg-slate-900 p-5 shadow-xl">
        <div class="mb-3 flex items-center justify-between gap-4">
          <label for="assembly" class="text-lg font-semibold">Assembly editor</label>
          <span class="text-xs text-slate-500">One instruction per line</span>
        </div>
        <textarea id="assembly" spellcheck="false"
          class="h-72 w-full resize-y rounded-xl border border-slate-700 bg-slate-950 p-4 font-mono text-sm leading-6 text-cyan-100 outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20">LC R0, 5
LC R1, 3
ADD R2, R0, R1
OVER</textarea>
        <div class="mt-4 flex flex-wrap gap-3">
          <button id="assemble" class="rounded-lg bg-cyan-500 px-4 py-2 font-semibold text-slate-950 hover:bg-cyan-400">Assemble</button>
          <button id="step" class="rounded-lg bg-slate-700 px-4 py-2 font-semibold hover:bg-slate-600">Step</button>
          <button id="run" class="rounded-lg bg-emerald-500 px-4 py-2 font-semibold text-slate-950 hover:bg-emerald-400">Run</button>
          <button id="reset" class="rounded-lg bg-slate-700 px-4 py-2 font-semibold hover:bg-slate-600">Reset</button>
        </div>
        <p id="status" role="status" aria-live="polite" class="mt-4 min-h-5 text-sm text-slate-400">Ready. Assemble a program to begin.</p>
      </section>

      <section aria-labelledby="cpu-heading" class="rounded-2xl border border-slate-800 bg-slate-900 p-5 shadow-xl">
        <div class="mb-4 flex items-center justify-between">
          <h2 id="cpu-heading" class="text-lg font-semibold">CPU state</h2>
          <span id="cpu-status" class="rounded-full bg-slate-800 px-3 py-1 text-xs text-slate-300">Idle</span>
        </div>
        <div class="grid grid-cols-2 gap-3 sm:grid-cols-3">
          <div class="rounded-xl border border-slate-800 bg-slate-950 p-4"><p class="text-xs font-semibold uppercase tracking-wider text-slate-500">R0</p><p id="r0" class="mt-2 font-mono text-2xl font-bold">00</p></div>
          <div class="rounded-xl border border-slate-800 bg-slate-950 p-4"><p class="text-xs font-semibold uppercase tracking-wider text-slate-500">R1</p><p id="r1" class="mt-2 font-mono text-2xl font-bold">00</p></div>
          <div class="rounded-xl border border-slate-800 bg-slate-950 p-4"><p class="text-xs font-semibold uppercase tracking-wider text-slate-500">R2</p><p id="r2" class="mt-2 font-mono text-2xl font-bold">00</p></div>
          <div class="rounded-xl border border-slate-800 bg-slate-950 p-4"><p class="text-xs font-semibold uppercase tracking-wider text-slate-500">R3</p><p id="r3" class="mt-2 font-mono text-2xl font-bold">00</p></div>
          <div class="rounded-xl border border-slate-800 bg-slate-950 p-4"><p class="text-xs font-semibold uppercase tracking-wider text-slate-500">PC</p><p id="pc" class="mt-2 font-mono text-2xl font-bold">00</p></div>
          <div class="rounded-xl border border-slate-800 bg-slate-950 p-4"><p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Zero Flag</p><p id="zero-flag" class="mt-2 font-mono text-2xl font-bold">0</p></div>
        </div>
      </section>
    </div>

    <section class="mt-6 rounded-2xl border border-slate-800 bg-slate-900 p-5 shadow-xl">
      <div class="mb-4 flex flex-wrap items-end justify-between gap-2">
        <div>
          <h2 class="text-lg font-semibold">RAM</h2>
          <p class="text-sm text-slate-400">Addresses <code>0x00</code>–<code>0xFF</code></p>
        </div>
        <span class="text-xs text-slate-500">Values shown in hexadecimal</span>
      </div>
      <div id="ram" aria-label="256-byte RAM grid" class="grid grid-cols-4 gap-1.5 sm:grid-cols-8 md:grid-cols-16"></div>
    </section>
  </main>
</body>
</html>
